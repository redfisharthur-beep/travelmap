<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e2d7">
  <meta name="description" content="台灣景點推薦，以實際評價和網路資訊交叉評估，找到適合的旅遊目的地。">
  <title>台灣景點地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <section id="home" class="home" aria-label="點選台灣縣市">
    <img id="heroImage" class="hero-image" alt="台灣旅遊地圖" hidden>
    <div class="home-fallback" aria-hidden="true">
      <div class="fallback-title">台灣旅行地圖</div>
      <div class="fallback-subtitle">選一座城市，找到值得出發的地方</div>
    </div>
    <div id="mapArea" class="map-area">
      <svg id="countyMap" class="county-map" viewBox="0 0 450 700" role="group" aria-label="台灣縣市選擇地圖"></svg>
    </div>
    <div class="island-choices">
      <button type="button" data-county="金門縣">金門縣</button>
      <button type="button" data-county="連江縣">連江縣</button>
      <button type="button" data-county="澎湖縣">澎湖縣</button>
    </div>
  </section>
  <section id="details" class="details" hidden>
    <div class="page-shell">
      <header class="page-header">
        <button id="returnBtn" class="back-button" type="button">返回</button>
        <div class="page-heading">
          <p class="kicker">台灣旅行地圖</p>
          <h1 id="countyTitle"></h1>
        </div>
      </header>
      <main>
        <div class="filter-panel">
          <div class="filter-row first-row">
            <label class="filter-label" for="townSelect">地區</label>
            <select id="townSelect" aria-label="鄉鎮市區"><option value="">全區</option></select>
          </div>
          <div class="filter-row">
            <span class="filter-label">門票</span>
            <div id="priceFilter" class="choice-group" role="group" aria-label="門票價格">
              <button type="button" class="choice active" data-value="all" aria-pressed="true">不限</button>
              <button type="button" class="choice" data-value="under200" aria-pressed="false">200 以內</button>
              <button type="button" class="choice" data-value="200to600" aria-pressed="false">200～600</button>
              <button type="button" class="choice" data-value="over600" aria-pressed="false">600 以上</button>
            </div>
          </div>
          <div class="filter-row">
            <span class="filter-label">類型</span>
            <div id="typeFilter" class="choice-group" role="group" aria-label="景點類型">
              <button type="button" class="choice active" data-value="all" aria-pressed="true">不限</button>
              <button type="button" class="choice" data-value="indoor" aria-pressed="false">室內</button>
              <button type="button" class="choice" data-value="outdoor" aria-pressed="false">戶外</button>
            </div>
          </div>
        </div>
        <div class="result-heading">
          <h2>推薦景點</h2>
          <span id="resultCount" aria-live="polite"></span>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
      </main>
    </div>
  </section>
</body>
</html>
